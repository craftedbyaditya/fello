# Nginx vhost for https://kaydo.sayge.in
# Point DNS A/AAAA (or CNAME) for kaydo.sayge.in at this server, then enable TLS
# (certbot --nginx -d kaydo.sayge.in).

server {
  listen 80;
  listen [::]:80;
  server_name kaydo.sayge.in;

  # Redirect HTTP → HTTPS (enable after certbot)
  # return 301 https://$host$request_uri;

  root /var/www/kaydo/current;
  index index.html;

  # Hashed Flutter assets can be cached aggressively.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /canvaskit/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback for go_router paths (/dashboard, /f/:slug, …).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# After certbot, prefer the HTTPS server block it generates and keep the
# try_files SPA fallback + asset cache headers above.
