<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kaydo — collect feedback with shareable forms and a clear organisation dashboard.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kaydo">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>
  <title>Kaydo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #FAFAFA;
    }
    .loading {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      box-sizing: border-box;
      padding: 24px;
      background: #FAFAFA;
    }
    .loading-mark {
      width: min(220px, 48vw);
      height: auto;
      display: block;
      object-fit: contain;
    }
    .loading-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid #E7F7EE;
      border-top-color: #028C50;
      animation: kaydo-spin 0.8s linear infinite;
    }
    @keyframes kaydo-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <img
      class="loading-mark"
      src="assets/loading_mark.jpg"
      alt="Kaydo"
    />
    <div class="loading-spinner" aria-label="Loading"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
